apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mate-ingress
  namespace: todoapp
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - http:
        paths:
          - pathType: ImplementationSpecific
            path: /(.*)
            backend:
              service:
                name: todoapp-nodeport
                port:
                  number: 80