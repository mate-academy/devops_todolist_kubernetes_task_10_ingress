apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
annotations:
  nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      path:
        - pathType: Prefix
          path: /(/$)(.*)
          backend:
            service:
              name: kube2py-blue-service
              port:
                number: 80
        - pathType: Prefix
          path: /green(/|$)(.*)
          backend:
            service:
              name: kube2py-gree-service
              port:
                number: 80
