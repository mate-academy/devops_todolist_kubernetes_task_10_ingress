# infrastructure/ingress/ingress.yml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Перенаправлення всього, що прийшло після кореня, в той самий шлях у бекенді
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: todo-service     # <-- заміни на точну назву твого Service
                port:
                  number: 8000         # <-- заміни на порт твого Service
