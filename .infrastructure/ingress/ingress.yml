apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todoapp-ingress
  annotations:
    # Обов'язкова анотація для використання RegEx у полі 'path'
    nginx.ingress.kubernetes.io/use-regex: "true"
    
    # ВИПРАВЛЕНО: Правильно посилаємося на першу (і єдину) групу захоплення (.*)
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - http:
      paths:
      # RegEx, що захоплює весь шлях, включаючи корінь (/), як змінну $1
      - pathType: ImplementationSpecific
        path: /?(.*) 
        backend:
          service:
            name: todoapp-service
            port:
              number: 80