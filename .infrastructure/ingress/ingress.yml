apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-todoapp
  labels:
    app.kubernetes.io/name: ingress-todoapp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  namespace: todoapp
spec:
  rules:
    - http:
        paths:
        - pathType: ImplementationSpecific
          path: "/?(.*)"
          backend:
            service:
              name: todoapp-service
              port: 
                number: 80
