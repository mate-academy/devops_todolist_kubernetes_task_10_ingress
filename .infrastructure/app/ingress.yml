apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    http:
      paths:
      - pathType: Prefix
        path: /?(.*)
        backend:
          service:
            name: app-service
            port: 
              number: 80
