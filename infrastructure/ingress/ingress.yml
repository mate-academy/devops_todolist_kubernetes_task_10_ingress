apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: app-ingress
 namespace: todoapp
 annotations:
   nginx.ingress.kubernetes.io/rewrite-target: /$1
   nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          - backend:
              service:
                name: todoapp-service
                port:
                  number: 80
            pathType: ImplementationSpecific
            path: /(.*)
  ingressClassName: nginx
